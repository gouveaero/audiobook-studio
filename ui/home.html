<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.png">
<title>Audiobook Studio</title>
<link rel="stylesheet" href="/fonts.css">
<style>
:root { --a: #35e6ff; --bg: #02070c; --tx: #d8f7ff; --dim: rgba(216,247,255,.55); --ok: #3dff7a; --bad: #ff6b6b; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: radial-gradient(ellipse at 50% 0%, #0b2733, var(--bg) 60%); color: var(--tx); font-family: "Oxanium", system-ui, sans-serif; min-height: 100vh; padding: 48px 20px 80px; }
main { max-width: 760px; margin: 0 auto; }
h1 { font-size: 40px; font-weight: 700; letter-spacing: .02em; }
.sub { color: var(--dim); margin: 6px 0 28px; font-size: 18px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 22px; }
button, label.btn, a.btn { background: transparent; color: var(--a); border: 1.5px solid var(--a); border-radius: 10px; padding: 10px 18px; font: inherit; font-size: 16px; cursor: pointer; display: inline-block; text-decoration: none; }
button:hover, label.btn:hover, a.btn:hover { background: color-mix(in srgb, var(--a) 18%, transparent); }
button.go { background: var(--a); color: #00131a; font-weight: 700; }
button.go:disabled, label.btn.go.disabled { opacity: .45; pointer-events: none; }
button.ghost { border-color: color-mix(in srgb, var(--a) 40%, transparent); color: var(--dim); }
input[type=file] { display: none; }
.list { display: flex; flex-direction: column; gap: 10px; }
.item { border: 1px solid color-mix(in srgb, var(--a) 35%, transparent); background: color-mix(in srgb, var(--a) 5%, transparent); border-radius: 12px; padding: 16px 18px; display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.item h2 { font-size: 20px; font-weight: 600; }
.item p { color: var(--dim); font-size: 14px; margin-top: 4px; }
.vazio { color: var(--dim); font-size: 16px; padding: 24px 0; }
.err { color: var(--bad); margin-top: 14px; font-size: 15px; }
.ai { font-size: 14px; color: var(--dim); border-left: 3px solid var(--a); padding: 6px 12px; margin-top: 32px; }
.upd { border: 1px solid color-mix(in srgb, var(--a) 45%, transparent); background: color-mix(in srgb, var(--a) 10%, transparent); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: 15px; }
.upd a { color: var(--a); }
.modelo { border: 1px solid color-mix(in srgb, var(--a) 45%, transparent); background: color-mix(in srgb, var(--a) 8%, transparent); border-radius: 12px; padding: 16px 18px; margin-bottom: 20px; }
.modelo h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.modelo p { color: var(--dim); font-size: 15px; margin-bottom: 10px; }
.modelo .barra { height: 8px; background: color-mix(in srgb, var(--a) 18%, transparent); border-radius: 999px; overflow: hidden; margin: 8px 0 12px; }
.modelo .barra > i { display: block; height: 100%; width: 0; background: var(--a); }
.modelo .msg { color: var(--bad); font-size: 14px; margin-bottom: 10px; }
.modelo .msg.ok { color: var(--ok); }
</style>
</head>
<body>
<main>
  <h1>Audiobook Studio</h1>
  <p class="sub">Seus audiolivros neste computador. Funciona sem internet depois que o modelo já foi baixado.</p>
  <div id="modelo" class="modelo" hidden>
    <h2>Modelo de voz</h2>
    <p id="modeloTam"></p>
    <div class="barra" id="modeloBarra" hidden><i id="modeloFill"></i></div>
    <p id="modeloProg" hidden></p>
    <p id="modeloMsg" class="msg" hidden></p>
    <button type="button" class="go" id="modeloBtn">Baixar modelo</button>
  </div>
  <div class="row">
    <label class="btn go" id="novoLbl">Novo audiolivro<input type="file" id="epub" accept=".epub"></label>
    <button type="button" class="ghost" id="sobre">Sobre</button>
    <a class="btn" id="doar" hidden target="_blank" rel="noopener">Doar</a>
    <a class="btn" id="android" hidden target="_blank" rel="noopener">Lista de espera Android</a>
  </div>
  <div id="update" class="upd" hidden></div>
  <div id="err" class="err" hidden></div>
  <div id="lista" class="list"></div>
  <div id="vazio" class="vazio" hidden>Nenhum livro ainda. Escolha um EPUB em português para começar.</div>
  <p class="ai">A narração é gerada por inteligência artificial.</p>
</main>
<script src="/studio.js"></script>
<script>
const $ = (i) => document.getElementById(i);
const err = (m) => { $("err").hidden = !m; $("err").textContent = m || ""; };
let modeloOk = false;
let pollModelo = null;

$("sobre").onclick = () => { location.href = studio.href("/about.html"); };

function fmtBytes(n) {
  n = Number(n) || 0;
  if (n >= 1024 * 1024 * 1024) return (n / (1024 * 1024 * 1024)).toFixed(1).replace(".", ",") + " GB";
  if (n >= 1024 * 1024) return Math.round(n / (1024 * 1024)) + " MB";
  if (n >= 1024) return Math.round(n / 1024) + " KB";
  return n + " B";
}

function setNovoEnabled(ok) {
  modeloOk = !!ok;
  const lbl = $("novoLbl");
  if (ok) lbl.classList.remove("disabled");
  else lbl.classList.add("disabled");
  $("epub").disabled = !ok;
}

function pintarModelo(info) {
  const box = $("modelo");
  const st = (info && info.status) || "ausente";
  if (st === "pronto") {
    box.hidden = true;
    setNovoEnabled(true);
    if (pollModelo) { clearInterval(pollModelo); pollModelo = null; }
    return;
  }
  box.hidden = false;
  setNovoEnabled(false);
  const total = info.total_bytes || 0;
  $("modeloTam").textContent = "Tamanho do download: cerca de " + fmtBytes(total) + ".";
  const barra = $("modeloBarra");
  const fill = $("modeloFill");
  const prog = $("modeloProg");
  const msg = $("modeloMsg");
  const btn = $("modeloBtn");
  if (st === "baixando") {
    barra.hidden = false;
    prog.hidden = false;
    msg.hidden = true;
    const done = info.bytes || 0;
    const pct = total > 0 ? Math.min(100, Math.round(100 * done / total)) : 0;
    fill.style.width = pct + "%";
    prog.textContent = "Baixando… " + fmtBytes(done) + " de " + fmtBytes(total) + " (" + pct + "%).";
    btn.hidden = true;
    btn.disabled = true;
  } else if (st === "erro") {
    barra.hidden = false;
    prog.hidden = true;
    msg.hidden = false;
    msg.className = "msg";
    msg.textContent = info.error || "O download falhou. Verifique a conexão e tente de novo.";
    btn.hidden = false;
    btn.disabled = false;
    btn.textContent = "Tentar de novo";
  } else {
    barra.hidden = true;
    prog.hidden = true;
    msg.hidden = true;
    btn.hidden = false;
    btn.disabled = false;
    btn.textContent = "Baixar modelo";
  }
}

async function consultarModelo() {
  const info = await (await studio.fetch("/api/models")).json();
  pintarModelo(info);
  if (info.status === "baixando" && !pollModelo) {
    pollModelo = setInterval(() => {
      consultarModelo().catch(() => {});
    }, 500);
  }
  return info;
}

$("modeloBtn").onclick = async () => {
  err("");
  $("modeloBtn").disabled = true;
  try {
    await studio.post("/api/models/download", null);
    if (!pollModelo) {
      pollModelo = setInterval(() => {
        consultarModelo().catch(() => {});
      }, 500);
    }
    await consultarModelo();
  } catch (ex) {
    $("modeloMsg").hidden = false;
    $("modeloMsg").className = "msg";
    $("modeloMsg").textContent = ex.message || "O download falhou. Verifique a conexão e tente de novo.";
    $("modeloBtn").disabled = false;
    $("modeloBtn").textContent = "Tentar de novo";
  }
};

async function linksExtras() {
  try {
    const j = await (await studio.fetch("/api/version")).json();
    const doar = $("doar");
    const andr = $("android");
    if (j.donation_url) {
      doar.hidden = false;
      doar.href = j.donation_url;
    } else {
      doar.hidden = true;
      doar.removeAttribute("href");
    }
    if (j.android_waitlist_url) {
      andr.hidden = false;
      andr.href = j.android_waitlist_url;
    } else {
      andr.hidden = true;
      andr.removeAttribute("href");
    }
  } catch (e) {}
  try {
    const u = await (await studio.fetch("/api/updates")).json();
    const box = $("update");
    if (u && u.update_available && u.latest) {
      box.hidden = false;
      const dest = u.release_url || "#";
      box.innerHTML = "Há uma versão nova (" + u.latest + "). " +
        '<a href="' + dest + '" target="_blank" rel="noopener">Ver no GitHub</a>';
    } else {
      box.hidden = true;
      box.textContent = "";
    }
  } catch (e) {
    // sem internet ou falha: silencioso (R44)
  }
}

async function carregar() {
  err("");
  await linksExtras();
  await consultarModelo();
  const j = await (await studio.fetch("/api/projects")).json();
  const lista = $("lista");
  lista.innerHTML = "";
  const projects = j.projects || [];
  $("vazio").hidden = projects.length > 0;
  for (const p of projects) {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `<div><h2></h2><p></p></div><button type="button">Abrir</button>`;
    el.querySelector("h2").textContent = p.title || p.id;
    el.querySelector("p").textContent = (p.author ? p.author + " · " : "") + p.id;
    el.querySelector("button").onclick = () => { location.href = studio.href("/review.html?id=" + encodeURIComponent(p.id)); };
    lista.appendChild(el);
  }
}

$("epub").onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  err("");
  if (!modeloOk) {
    err("Baixe o modelo de voz antes de criar um audiolivro.");
    e.target.value = "";
    return;
  }
  try {
    const j = await studio.post("/api/projects", f);
    location.href = studio.href("/review.html?id=" + encodeURIComponent(j.id));
  } catch (ex) {
    err(ex.message || "Não foi possível ler este EPUB.");
  } finally {
    e.target.value = "";
  }
};

carregar().catch((ex) => err(ex.message || "Não foi possível listar os livros."));
</script>
</body>
</html>
